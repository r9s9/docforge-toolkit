name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and the test tools
        run: python -m pip install . pytest==9.2.0 ruff==0.17.3
      - name: Lint
        run: ruff check src/docforge/toolkit tools tests plugin_checks
      - name: Engine matches its upstream lock
        run: python tools/sync_upstream.py --verify
      - name: Tests
        run: pytest

  package:
    # Build the wheel and use it the way the plugin does, in a clean environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build
      - name: Install the wheel in a fresh virtual environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
      - name: Make, fill and check with the installed command
        working-directory: /tmp
        run: |
          /tmp/clean/bin/docforge-live doctor
          /tmp/clean/bin/python -m docforge.toolkit demo --out demo
          /tmp/clean/bin/docforge-live analyze demo/invoice_1.docx demo/invoice_2.docx --work w --mode smart
          /tmp/clean/bin/docforge-live build --work w --name Invoice --out pkg
          /tmp/clean/bin/docforge-live check pkg demo/invoice_edited.docx

  upstream-parity:
    # DocForge's own engine tests, run against this copy of the engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The commit recorded in tools/upstream.lock.json; tests/test_package.py
      # fails when the two differ, so a re-sync updates both.
      - uses: actions/checkout@v4
        with:
          repository: r9s9/docforge
          ref: 4880faa8cfb39be7f155b5db8c9e3bc54ee2193f
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . pytest==9.2.0
      - name: Run upstream engine tests on the copy
        run: python tools/run_upstream_tests.py --from upstream
